server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: serve os estáticos e cai no index.html para rotas do React Router.
    location / {
        try_files $uri /index.html;
    }

    # API Laravel: front controller via PHP-FPM.
    location /api {
        try_files $uri @api;
    }

    # Sanctum (cookie CSRF) é servido pelo Laravel.
    location /sanctum {
        try_files $uri @api;
    }

    location @api {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/api/public;
    }
}
