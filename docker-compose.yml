services:
  nginx:
    build: ./web
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build: ./api
    depends_on:
      - mysql
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-mensalize}"
      DB_USERNAME: "${DB_USERNAME:-mensalize}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-localhost}"
      SESSION_DOMAIN: "${SESSION_DOMAIN:-localhost}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-false}"
    volumes:
      # Só o storage é persistido: o código vem da imagem (preserva o vendor do build).
      - apistorage:/var/www/api/storage
    restart: unless-stopped

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-mensalize}"
      MYSQL_USER: "${DB_USERNAME:-mensalize}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-secret}"
    volumes:
      - dbdata:/var/lib/mysql
    restart: unless-stopped

volumes:
  dbdata:
  apistorage:
